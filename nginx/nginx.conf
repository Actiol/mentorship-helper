events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    # Don't leak nginx version
    server_tokens off;

    # Increase body size limit for .osz uploads (150 MB)
    client_max_body_size 150M;

    upstream api {
        server api:8000;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name mentorship.yourdomain.com;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name mentorship.yourdomain.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # ── Userscript install endpoint ───────────────────────────────────────
        location = /install {
            alias   /srv/userscript/mentorship.user.js;
            add_header Content-Type        "application/javascript; charset=utf-8";
            add_header Content-Disposition 'inline; filename="mentorship.user.js"';
            # Tell Tampermonkey it can check for updates
            add_header Cache-Control "no-cache";
        }

        # ── Internal .osz file serving (X-Accel-Redirect target) ─────────────
        # Only the API can trigger this via X-Accel-Redirect — never hit directly
        location /internal/osz/ {
            internal;
            alias /data/osz/;
        }

        # ── API proxy (everything else) ───────────────────────────────────────
        location / {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;   # allow time for URL fetches
        }
    }
}
