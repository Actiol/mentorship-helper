events {
    worker_connections 2048;
    use epoll;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 150M;

    # Security & anonymity
    server_tokens off;

    # Logging
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    upstream api {
        server api:8000;
        keepalive 16;
    }

    # Health check endpoint
    server {
        listen 80;
        server_name _;
        
        location = /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name mentorship.actiol.dev *.mentorship.actiol.dev;

        # Let Let's Encrypt through for renewals
        location /.well-known/acme-challenge/ {
            root /var/lib/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name mentorship.actiol.dev;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_trusted_certificate /etc/nginx/certs/chain.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Health check endpoint ──────────────────────────────────────────────
        location = /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
            access_log off;
        }

        # ── Userscript install endpoint ───────────────────────────────────────
        location = /install {
            alias   /srv/userscript/mentorship.user.js;
            add_header Content-Type        "application/javascript; charset=utf-8";
            add_header Content-Disposition 'inline; filename="mentorship.user.js"';
            add_header Cache-Control "no-cache";
        }

        # ── Internal .osz file serving (X-Accel-Redirect target) ─────────────
        # Only the API can trigger this via X-Accel-Redirect — never hit directly
        location /internal/osz/ {
            internal;
            alias /data/osz/;
        }

        # ── API proxy (everything else) ───────────────────────────────────────
        location / {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }
    }
}
