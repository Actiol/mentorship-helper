events {
    worker_connections 2048;
    use epoll;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 150M;

    # Security & anonymity
    server_tokens off;

    # Logging
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    upstream api {
        server api:8000;
        keepalive 16;
    }

    # Health check endpoint
    server {
        listen 80;
        server_name _;
        
        location = /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # ── HTTP (served via Cloudflare tunnel, SSL handled by tunnel) ─────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name mentorship.actiol.dev *.mentorship.actiol.dev;
        http2 on;

        # ── Health check endpoint ──────────────────────────────────────────────
        location = /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
            access_log off;
        }

        # ── Userscript install endpoint ───────────────────────────────────────
        location = /install {
            # Point to the file directly using try_files to completely bypass the API proxy
            try_files /srv/userscript/mentorship.user.js =404;
            
            add_header Content-Type        "application/javascript; charset=utf-8";
            add_header Content-Disposition 'inline; filename="mentorship.user.js"';
            add_header Cache-Control       "no-cache, no-store, must-revalidate";
            add_header Pragma              "no-cache";
            add_header Expires             0;
        }

        # ── Internal .osz file serving (X-Accel-Redirect target) ─────────────
        location /internal/osz/ {
            internal;
            alias /data/osz/;
        }

        # ── API proxy (everything else) ───────────────────────────────────────
        location / {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }
    }
}