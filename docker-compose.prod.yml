# Production docker-compose for Portainer deployment
# Domain: mentorship.actiol.dev
# 
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 
# Or in Portainer: upload this as the stack file

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    container_name: mentorship-db
    labels:
      com.mentorship.description: "PostgreSQL database for mentorship application"
      com.mentorship.version: "16"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mentorship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error: POSTGRES_PASSWORD not set}
      POSTGRES_DB: ${POSTGRES_DB:-mentorship}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mentorship
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mentorship} -d ${POSTGRES_DB:-mentorship}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: ${DOCKER_REGISTRY:-mentorship}/api:${API_TAG:-latest}
    restart: always
    container_name: mentorship-api
    labels:
      com.mentorship.description: "FastAPI backend for mentorship application"
      com.mentorship.component: "api"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mentorship}:${POSTGRES_PASSWORD:?error: POSTGRES_PASSWORD not set}@db:5432/${POSTGRES_DB:-mentorship}
      OSU_CLIENT_ID: ${OSU_CLIENT_ID:?error: OSU_CLIENT_ID not set}
      OSU_CLIENT_SECRET: ${OSU_CLIENT_SECRET:?error: OSU_CLIENT_SECRET not set}
      JWT_SECRET: ${JWT_SECRET:?error: JWT_SECRET not set}
      BASE_URL: ${BASE_URL:-https://mentorship.actiol.dev}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://osu.ppy.sh}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?error: DISCORD_BOT_TOKEN not set}
      OSZ_STORAGE_DIR: /data/osz
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - oszdata:/data/osz
    networks:
      - mentorship
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: ${DOCKER_REGISTRY:-mentorship}/bot:${BOT_TAG:-latest}
    restart: always
    container_name: mentorship-bot
    labels:
      com.mentorship.description: "Discord bot for mentorship verification"
      com.mentorship.component: "bot"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mentorship}:${POSTGRES_PASSWORD:?error: POSTGRES_PASSWORD not set}@db:5432/${POSTGRES_DB:-mentorship}
      DISCORD_TOKEN: ${DISCORD_TOKEN:?error: DISCORD_TOKEN not set}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?error: DISCORD_CLIENT_ID not set}
      OSU_VERIFY_BASE_URL: ${OSU_VERIFY_BASE_URL:-https://mentorship.actiol.dev/auth/discord-verify}
      API_BASE_URL: ${API_BASE_URL:-https://mentorship.actiol.dev}
      API_BOT_SECRET: ${API_BOT_SECRET:?error: API_BOT_SECRET not set}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - mentorship
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-mentorship}/nginx:${NGINX_TAG:-latest}
    restart: always
    container_name: mentorship-nginx
    labels:
      com.mentorship.description: "Nginx reverse proxy and SSL termination"
      com.mentorship.component: "web"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./userscript:/srv/userscript:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - oszdata:/data/osz:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - mentorship
    environment:
      SERVER_NAME: ${SERVER_NAME:-mentorship.actiol.dev}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  pgdata:
    driver: local
  oszdata:
    driver: local

networks:
  mentorship:
    driver: bridge
