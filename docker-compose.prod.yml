version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: mentorship-db
    labels:
      com.mentorship.description: "PostgreSQL database for mentorship application"
      com.mentorship.version: "16"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mentorship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mentorship}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mentorship} -d ${POSTGRES_DB:-mentorship}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    container_name: mentorship-api
    labels:
      com.mentorship.description: "FastAPI backend for mentorship application"
      com.mentorship.component: "api"
    depends_on:
      db:
        condition: service_healthy
    # Automated migration step right before runtime execution
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mentorship}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mentorship}
      OSU_CLIENT_ID: ${OSU_CLIENT_ID}
      OSU_CLIENT_SECRET: ${OSU_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      BASE_URL: ${BASE_URL:-https://mentorship.actiol.dev}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://osu.ppy.sh}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      OSZ_STORAGE_DIR: /data/osz
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - oszdata:/data/osz
    networks:
      - internal
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    container_name: mentorship-bot
    labels:
      com.mentorship.description: "Discord bot for mentorship verification"
      com.mentorship.component: "bot"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mentorship}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mentorship}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      OSU_VERIFY_BASE_URL: ${OSU_VERIFY_BASE_URL:-https://mentorship.actiol.dev/auth/discord-verify}
      API_BASE_URL: ${API_BASE_URL:-https://mentorship.actiol.dev}
      API_BOT_SECRET: ${API_BOT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: mentorship
    labels:
      com.mentorship.description: "Nginx reverse proxy and SSL termination"
      com.mentorship.component: "web"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      # Maps the standalone userscript file directly inside the target directory path expected by Nginx
      #- ./userscript/mentorship.user.js:/srv/userscript/mentorship.user.js:ro
      - oszdata:/data/osz:ro
    networks:
      - internal
      - cloudflared_tunnel
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  pgdata:
    driver: local
  oszdata:
    driver: local

networks:
  internal:
    driver: bridge
  cloudflared_tunnel:
    external: true